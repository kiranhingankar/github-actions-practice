name: Test Secrets

# Trigger the workflow on push to the main branch
on:
  push:
    branches: [main]

jobs:
  # Job 1: Directly access secrets in GitHub Actions context
  secrets-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check if the secret exists
      - name: Print secrets existence
        # GitHub automatically masks secret values in logs
        run: echo "The secret is set - ${{ secrets.MY_SECRET_MESSAGE != '' }}"

      # Step 2: Attempt to print the secret value (unsafe)
      - name: Print secret value
        # GitHub masks the actual secret with *** in logs
        run: echo "The secret is - ${{ secrets.MY_SECRET_MESSAGE }}"

  # Job 2: Access secret via environment variable
  env-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Print secret via environment variable
        # Pass the GitHub secret to a shell environment variable
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_MESSAGE }}  # <-- fixed missing closing brace
        # Access the environment variable using correct Bash syntax (no spaces inside ${})
        run: echo "The environment variable access secret is - ${MY_SECRET}"
