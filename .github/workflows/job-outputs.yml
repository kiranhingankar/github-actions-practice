name: Job Outputs Demo

on:
  push:

jobs:
  generate_date:
    runs-on: ubuntu-latest

    outputs:
      today: ${{ steps.date-step.outputs.today }}

    steps:
      - name: Generate Date
        id: date-step
        run: echo "today=$(date)" >> $GITHUB_OUTPUT

  print_date:
    runs-on: ubuntu-latest
    needs: generate_date

    steps:
      - name: Print Date
        run: echo "Date from previous job - ${{ needs.generate-date.outputs.today }}"