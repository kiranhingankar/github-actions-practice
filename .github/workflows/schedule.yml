# Workflow name displayed in GitHub Actions
name: Scheduled Workflow

# Define workflow trigger
on:

  # Run workflow automatically on a schedule
  schedule:

    # Cron syntax:
    # ┌──────── minute (0 - 59)
    # │ ┌────── hour (0 - 23)
    # │ │ ┌──── day of month (1 - 31)
    # │ │ │ ┌── month (1 - 12)
    # │ │ │ │ ┌─ day of week (0 - 6) (Sunday = 0)
    # │ │ │ │ │
    # │ │ │ │ │
    # 0 0 * * *  -> Runs every day at 00:00 UTC
    - cron: '0 0 * * *'

# Jobs section
jobs:

  # Job ID
  scheduled-job:

    # Runner environment
    runs-on: ubuntu-latest

    # Steps executed inside the job
    steps:

      # Print scheduled workflow message
      - name: Print message
        run: 'echo "This workflow runs every day at midnight UTC"'
