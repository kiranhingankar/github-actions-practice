name: Github Hosted Runners

on:
  workflow_dispatch:
    
jobs:
  ubuntu-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print runner details
        run: |
          echo "OS: Ubuntu"
          echo "Hostname: $(hostname)"
          echo "Current User: $(whoami)"

  window-job:
    runs-on: windows-latest

    steps:
      - name: Print runner details
        shell: powershell
        run: |
          Write-Host "OS: Windows"
          Write-Host "Hostname: $env.COMPUTERNAME"
          Write-Host "Current User: $env.USERNAME"
  
  macos-job:
    runs-on: macos-latest

    steps:
      - name: Print runner details
        run: |
          echo "OS: macOS"
          echo "Hostname: $(hostname)"
          echo "Current User: $(whoami)"

  tools-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Installed tools
        run: |
          echo "Docker Version:"
          docker --version

          echo "Python Version:"
          python3 --version

          echo "Node Version:""
          node --version

          echo "Git Version:"
          git --version

          


